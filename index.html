<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <div id="app">
      <h1 class="mb-4">Software Development Project</h1>
      <div class="flex gap-6">
        <div
          id="todo-tasks-container"
          data-show-form="false"
          class="border space-y-4 p-4 group h-fit"
        >
          <h2 class="font-semibold">Not started</h2>

          <button id="add-task-button" class="w-full shadow-md p-2 border cursor-pointer">
            + Add task
          </button>

          <form
            id="new-todo-form"
            class="border-amber-500 hidden group-data-[show-form='true']:flex flex-col gap-4 shadow-md p-2"
          >
            <input
              name="new-todo"
              type="text"
              placeholder="new task"
              class="border p-2"
            />
            <button class="bg-blue-600 p-2 text-white">Add task</button>
          </form>

          <ul class="list max-w-80 w-80"></ul>
          <template id="todo-item-template">
            <li class="p-3 shadow max-w-full flex gap-2">
              <span
                class="text line-clamp-5 [&[contenteditable='true']]:ring-2 ring-offset-3 outline-none"
              >
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Beatae iusto quae
                eum error fuga laboriosam perferendis eius corporis voluptate consequatur.
                Aut beatae fugiat provident. Dignissimos obcaecati provident eum voluptate
                quo!
              </span>

              <button class="edit w-6 h-6 ml-auto">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
                  />
                </svg>
              </button>
            </li>
          </template>
        </div>

        <div class="border h-fit">
          <h2>In progress</h2>
          <button>+ Add task</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
